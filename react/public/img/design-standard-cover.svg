<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-label="Before and after: inconsistent UI versus design standards tokens">
  <defs>
    <linearGradient id="ds-g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="280" fill="#f4f4f5"/>

  <!-- LEFT: simple inconsistency -->
  <g>
    <rect x="36" y="28" width="300" height="224" fill="#fff" stroke="#d4d4d8" stroke-width="1.5"/>

    <rect x="56" y="56" width="88" height="28" rx="14" fill="#64748b"/>
    <rect x="160" y="62" width="64" height="18" rx="1" fill="#94a3b8"/>
    <rect x="240" y="52" width="72" height="36" rx="4" fill="#475569"/>

    <rect x="56" y="112" width="120" height="48" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="196" y="124" width="80" height="28" rx="10" fill="#cbd5e1"/>

    <rect x="56" y="184" width="180" height="10" fill="#334155"/>
    <rect x="56" y="204" width="100" height="5" fill="#94a3b8"/>
    <rect x="180" y="200" width="48" height="14" fill="#64748b"/>
    <rect x="56" y="224" width="210" height="4" fill="#cbd5e1"/>

    <text x="186" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#71717a" letter-spacing="0.12em">BEFORE</text>
  </g>

  <!-- VS badge -->
  <g>
    <circle cx="400" cy="130" r="26" fill="#fff" stroke="#0369a1" stroke-width="2"/>
    <text x="400" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#0369a1" letter-spacing="0.06em">VS</text>
  </g>

  <!-- RIGHT: standards features only (not a full page) -->
  <g>
    <rect x="464" y="28" width="300" height="224" fill="#fff" stroke="#7dd3fc" stroke-width="1.5"/>

    <text x="614" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#0369a1" letter-spacing="0.04em">SHARED RULES</text>

    <!-- aligned button set — the feature -->
    <rect x="500" y="92" width="72" height="26" rx="2" fill="#e0f2fe" stroke="#38bdf8"/>
    <rect x="584" y="92" width="72" height="26" rx="2" fill="#e0f2fe" stroke="#38bdf8"/>
    <rect x="668" y="92" width="56" height="26" rx="2" fill="#0369a1"/>

    <!-- type scale feature -->
    <rect x="500" y="136" width="180" height="10" rx="1" fill="#0c4a6e"/>
    <rect x="500" y="152" width="140" height="7" rx="1" fill="#0284c7"/>
    <rect x="500" y="166" width="100" height="5" rx="1" fill="#7dd3fc"/>

    <!-- token chips + check -->
    <rect x="500" y="190" width="52" height="18" rx="2" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="526" y="202" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#0c4a6e">WCAG</text>
    <rect x="560" y="190" width="60" height="18" rx="2" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="590" y="202" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#0c4a6e">TOKENS</text>
    <rect x="628" y="190" width="44" height="18" rx="2" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="650" y="202" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#0c4a6e">A11Y</text>

    <circle cx="716" cy="199" r="14" fill="#fff" stroke="url(#ds-g)" stroke-width="2"/>
    <path d="M710 199 L714 203 L724 192" fill="none" stroke="#0369a1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="614" y="232" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#64748b">Design standards</text>

    <text x="614" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#0369a1" letter-spacing="0.12em">AFTER</text>
  </g>
</svg>
