<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-label="Before and after: inconsistent UI pieces versus shared design system tokens and components">
  <defs>
    <linearGradient id="ds-g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="dsShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0c4a6e" flood-opacity="0.12"/>
    </filter>
    <filter id="dsShadowSm" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0c4a6e" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="800" height="280" fill="#f1f5f9"/>

  <!-- LEFT: floating mismatched pieces -->
  <g>
    <rect x="36" y="28" width="300" height="224" rx="6" fill="#e2e8f0"/>

    <rect x="62" y="58" width="92" height="30" rx="15" fill="#64748b" transform="rotate(-6 108 73)" filter="url(#dsShadowSm)"/>
    <rect x="170" y="70" width="70" height="20" rx="2" fill="#94a3b8" transform="rotate(8 205 80)" filter="url(#dsShadowSm)"/>
    <rect x="250" y="48" width="60" height="40" rx="4" fill="#475569" transform="rotate(12 280 68)" filter="url(#dsShadowSm)"/>

    <rect x="70" y="120" width="110" height="50" rx="3" fill="#cbd5e1" stroke="#94a3b8" transform="rotate(-4 125 145)" filter="url(#dsShadowSm)"/>
    <rect x="200" y="130" width="78" height="32" rx="16" fill="#94a3b8" transform="rotate(10 239 146)" filter="url(#dsShadowSm)"/>

    <rect x="80" y="190" width="150" height="10" fill="#334155" transform="rotate(-3 155 195)"/>
    <rect x="90" y="210" width="90" height="6" fill="#94a3b8" transform="rotate(4 135 213)"/>
    <rect x="210" y="198" width="50" height="16" fill="#64748b" transform="rotate(-8 235 206)"/>

    <text x="186" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.12em">BEFORE</text>
  </g>

  <!-- VS -->
  <g>
    <circle cx="400" cy="130" r="26" fill="#fff" stroke="#0369a1" stroke-width="2" filter="url(#dsShadowSm)"/>
    <text x="400" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#0369a1" letter-spacing="0.06em">VS</text>
  </g>

  <!-- RIGHT: design system library — tokens + component specs (not a hero card) -->
  <g>
    <rect x="464" y="28" width="300" height="224" rx="6" fill="#e0f2fe"/>

    <!-- Token strip (color + type scale) -->
    <g filter="url(#dsShadowSm)">
      <rect x="480" y="44" width="268" height="52" rx="4" fill="#fff" stroke="#bae6fd"/>
      <text x="492" y="62" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#0369a1" letter-spacing="0.1em">TOKENS</text>
      <rect x="492" y="70" width="22" height="16" rx="2" fill="#0c4a6e"/>
      <rect x="518" y="70" width="22" height="16" rx="2" fill="#0369a1"/>
      <rect x="544" y="70" width="22" height="16" rx="2" fill="#38bdf8"/>
      <rect x="570" y="70" width="22" height="16" rx="2" fill="#e0f2fe" stroke="#7dd3fc"/>
      <!-- type scale -->
      <text x="612" y="68" font-family="system-ui,sans-serif" font-size="14" font-weight="800" fill="#0f172a">Aa</text>
      <text x="638" y="68" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#334155">Aa</text>
      <text x="662" y="68" font-family="system-ui,sans-serif" font-size="8" font-weight="500" fill="#64748b">Aa</text>
      <rect x="612" y="76" width="48" height="4" rx="1" fill="#94a3b8"/>
      <rect x="612" y="82" width="32" height="3" rx="1" fill="#cbd5e1"/>
      <rect x="700" y="70" width="32" height="16" rx="3" fill="#0369a1"/>
      <text x="716" y="81" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" font-weight="700" fill="#fff">4.5:1</text>
    </g>

    <!-- Component grid: Button / Input / Nav specs -->
    <g filter="url(#dsShadowSm)">
      <rect x="480" y="106" width="84" height="88" rx="4" fill="#fff" stroke="#7dd3fc"/>
      <text x="492" y="122" font-family="system-ui,sans-serif" font-size="7" font-weight="700" fill="#64748b" letter-spacing="0.06em">BUTTON</text>
      <rect x="492" y="132" width="60" height="18" rx="3" fill="#0369a1"/>
      <text x="522" y="144" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#fff">Primary</text>
      <rect x="492" y="156" width="60" height="18" rx="3" fill="#fff" stroke="#0369a1" stroke-width="1.5"/>
      <text x="522" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#0369a1">Secondary</text>
      <text x="522" y="186" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" font-weight="600" fill="#0284c7">focus · hover</text>
    </g>

    <g filter="url(#dsShadowSm)">
      <rect x="572" y="106" width="84" height="88" rx="4" fill="#fff" stroke="#7dd3fc"/>
      <text x="584" y="122" font-family="system-ui,sans-serif" font-size="7" font-weight="700" fill="#64748b" letter-spacing="0.06em">INPUT</text>
      <rect x="584" y="132" width="60" height="8" rx="1" fill="#94a3b8"/>
      <rect x="584" y="146" width="60" height="22" rx="3" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="590" y="154" width="28" height="6" rx="1" fill="#cbd5e1"/>
      <text x="614" y="186" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" font-weight="600" fill="#0284c7">label · error</text>
    </g>

    <g filter="url(#dsShadowSm)">
      <rect x="664" y="106" width="84" height="88" rx="4" fill="#fff" stroke="#7dd3fc"/>
      <text x="676" y="122" font-family="system-ui,sans-serif" font-size="7" font-weight="700" fill="#64748b" letter-spacing="0.06em">A11Y</text>
      <circle cx="688" cy="148" r="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
      <path d="M683 148 L686 151 L694 143" fill="none" stroke="#0369a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="706" y="146" font-family="system-ui,sans-serif" font-size="9" font-weight="800" fill="#0c4a6e">AA</text>
      <text x="706" y="158" font-family="system-ui,sans-serif" font-size="7" font-weight="600" fill="#64748b">WCAG</text>
      <rect x="676" y="170" width="60" height="14" rx="2" fill="#f0f9ff" stroke="#7dd3fc"/>
      <text x="706" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" font-weight="700" fill="#0369a1">Contrast OK</text>
    </g>

    <!-- linking rule -->
    <path d="M522 194 L614 194 L706 194" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.7"/>
    <text x="614" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#0c4a6e">One library · shared decisions</text>

    <text x="614" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#0369a1" letter-spacing="0.12em">AFTER</text>
  </g>
</svg>
