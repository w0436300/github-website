<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-label="Before and after: inconsistent UI versus design standards system">
  <defs>
    <linearGradient id="ds-g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="280" fill="#f4f4f5"/>

  <!-- LEFT: simple inconsistency -->
  <g>
    <rect x="36" y="28" width="300" height="224" fill="#fff" stroke="#d4d4d8" stroke-width="1.5"/>

    <!-- uneven header bars -->
    <rect x="52" y="44" width="90" height="28" rx="14" fill="#6366f1"/>
    <rect x="150" y="50" width="70" height="18" rx="2" fill="#f97316"/>
    <rect x="230" y="42" width="86" height="34" rx="4" fill="#22c55e"/>

    <!-- misaligned cards / spacing -->
    <rect x="48" y="92" width="110" height="56" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
    <rect x="168" y="100" width="70" height="40" rx="0" fill="#fee2e2" stroke="#ef4444"/>
    <rect x="250" y="88" width="72" height="68" rx="20" fill="#e0e7ff" stroke="#6366f1"/>

    <!-- chaotic type sizes -->
    <rect x="56" y="168" width="160" height="12" fill="#111827"/>
    <rect x="56" y="186" width="90" height="5" fill="#9ca3af"/>
    <rect x="200" y="172" width="50" height="20" fill="#64748b"/>
    <rect x="56" y="206" width="220" height="3" fill="#d1d5db"/>
    <rect x="80" y="216" width="140" height="8" fill="#374151"/>
    <rect x="56" y="232" width="40" height="4" fill="#a78bfa"/>
    <rect x="110" y="230" width="80" height="10" rx="5" fill="#fb7185"/>

    <text x="186" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#71717a" letter-spacing="0.12em">BEFORE</text>
  </g>

  <!-- VS badge -->
  <g>
    <circle cx="400" cy="130" r="26" fill="#fff" stroke="#0369a1" stroke-width="2"/>
    <text x="400" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#0369a1" letter-spacing="0.06em">VS</text>
  </g>

  <!-- RIGHT: consistent design standards -->
  <g>
    <rect x="464" y="28" width="300" height="224" fill="#fff" stroke="#7dd3fc" stroke-width="1.5"/>
    <rect x="464" y="28" width="300" height="36" fill="#f0f9ff" stroke="#7dd3fc"/>
    <circle cx="484" cy="46" r="5" fill="#f87171"/>
    <circle cx="502" cy="46" r="5" fill="#fbbf24"/>
    <circle cx="520" cy="46" r="5" fill="#34d399"/>
    <rect x="540" y="41" width="120" height="10" rx="1" fill="#bae6fd"/>

    <!-- aligned button row -->
    <rect x="484" y="80" width="72" height="22" rx="2" fill="#e0f2fe" stroke="#38bdf8"/>
    <rect x="568" y="80" width="72" height="22" rx="2" fill="#e0f2fe" stroke="#38bdf8"/>
    <rect x="652" y="80" width="72" height="22" rx="2" fill="#0369a1"/>

    <!-- consistent type scale -->
    <rect x="484" y="120" width="200" height="10" rx="1" fill="#0c4a6e"/>
    <rect x="484" y="138" width="160" height="7" rx="1" fill="#0284c7"/>
    <rect x="484" y="152" width="120" height="5" rx="1" fill="#7dd3fc"/>

    <!-- contrast / check -->
    <rect x="484" y="172" width="100" height="16" rx="1" fill="#0f172a"/>
    <rect x="484" y="194" width="80" height="16" rx="1" fill="#64748b"/>
    <circle cx="700" cy="192" r="28" fill="#fff" stroke="url(#ds-g)" stroke-width="2.5"/>
    <path d="M688 192 L696 200 L714 180" fill="none" stroke="#0369a1" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- token chips -->
    <rect x="484" y="224" width="48" height="16" rx="2" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="492" y="235" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#0c4a6e">WCAG</text>
    <rect x="540" y="224" width="56" height="16" rx="2" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="548" y="235" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#0c4a6e">TOKENS</text>
    <rect x="604" y="224" width="40" height="16" rx="2" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="612" y="235" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#0c4a6e">A11Y</text>

    <text x="614" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#0369a1" letter-spacing="0.12em">AFTER</text>
  </g>
</svg>
