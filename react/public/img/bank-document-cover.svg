<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-label="Before and after: static print forms versus system-mapped bank document template">
  <defs>
    <linearGradient id="bdg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0075BE"/>
      <stop offset="100%" stop-color="#005a94"/>
    </linearGradient>
    <filter id="bdShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0075BE" flood-opacity="0.12"/>
    </filter>
    <filter id="bdShadowSm" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0075BE" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="800" height="280" fill="#f1f5f9"/>

  <!-- LEFT: stacked print sheets -->
  <g>
    <rect x="36" y="28" width="300" height="224" rx="6" fill="#e2e8f0"/>

    <rect x="78" y="58" width="170" height="120" rx="4" fill="#fff" stroke="#cbd5e1" transform="rotate(-8 163 118)" filter="url(#bdShadowSm)"/>
    <rect x="90" y="72" width="110" height="6" fill="#94a3b8" transform="rotate(-8 145 75)"/>
    <rect x="92" y="88" width="130" height="3" fill="#e2e8f0" transform="rotate(-8 157 89)"/>
    <rect x="94" y="98" width="120" height="3" fill="#e2e8f0" transform="rotate(-8 154 99)"/>
    <rect x="96" y="108" width="100" height="3" fill="#e2e8f0" transform="rotate(-8 146 109)"/>

    <rect x="130" y="78" width="170" height="120" rx="4" fill="#fff" stroke="#cbd5e1" transform="rotate(6 215 138)" filter="url(#bdShadow)"/>
    <rect x="148" y="96" width="100" height="6" fill="#a1a1aa" transform="rotate(6 198 99)"/>
    <rect x="150" y="112" width="130" height="3" fill="#d4d4d8" transform="rotate(6 215 113)"/>
    <rect x="152" y="122" width="118" height="3" fill="#d4d4d8" transform="rotate(6 211 123)"/>
    <rect x="154" y="132" width="126" height="3" fill="#d4d4d8" transform="rotate(6 217 133)"/>
    <rect x="156" y="142" width="90" height="3" fill="#d4d4d8" transform="rotate(6 201 143)"/>
    <rect x="158" y="158" width="70" height="18" fill="#f1f5f9" stroke="#e2e8f0" transform="rotate(6 193 167)"/>

    <text x="186" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#64748b">Static print forms</text>
    <text x="186" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.12em">BEFORE</text>
  </g>

  <!-- VS -->
  <g>
    <circle cx="400" cy="130" r="26" fill="#fff" stroke="#0075BE" stroke-width="2" filter="url(#bdShadowSm)"/>
    <text x="400" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#0075BE" letter-spacing="0.06em">VS</text>
  </g>

  <!-- RIGHT: system-ready template — field map + conditional doc (not a hero card) -->
  <g>
    <rect x="464" y="28" width="300" height="224" rx="6" fill="#dbeafe"/>

    <!-- Document template sheet -->
    <g filter="url(#bdShadow)">
      <rect x="478" y="42" width="168" height="188" rx="3" fill="#fff" stroke="#93c5fd"/>
      <!-- header bar -->
      <rect x="478" y="42" width="168" height="22" rx="3" fill="#0075BE"/>
      <rect x="478" y="58" width="168" height="6" fill="#0075BE"/>
      <text x="490" y="58" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#fff">Disclosure template</text>

      <!-- section: system fields (key-value) -->
      <text x="490" y="82" font-family="system-ui,sans-serif" font-size="7" font-weight="700" fill="#64748b" letter-spacing="0.08em">SYSTEM FIELDS</text>
      <rect x="490" y="90" width="144" height="28" rx="2" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="498" y="102" font-family="system-ui,sans-serif" font-size="7" font-weight="600" fill="#64748b">Acct #</text>
      <rect x="540" y="95" width="86" height="10" rx="1" fill="#c8dff0"/>
      <text x="545" y="103" font-family="system-ui,sans-serif" font-size="7" font-weight="700" fill="#005a94">•••• 4821</text>
      <text x="498" y="114" font-family="system-ui,sans-serif" font-size="7" font-weight="600" fill="#64748b">Rate</text>
      <rect x="528" y="107" width="40" height="8" rx="1" fill="#c8dff0"/>
      <text x="535" y="114" font-family="system-ui,sans-serif" font-size="7" font-weight="700" fill="#005a94">4.25%</text>

      <!-- legal copy with highlighted field -->
      <text x="490" y="136" font-family="system-ui,sans-serif" font-size="7" font-weight="700" fill="#64748b" letter-spacing="0.08em">LEGAL COPY</text>
      <rect x="490" y="142" width="144" height="3" rx="1" fill="#e2e8f0"/>
      <rect x="490" y="148" width="100" height="3" rx="1" fill="#e2e8f0"/>
      <rect x="594" y="148" width="40" height="8" rx="1" fill="#bfdbfe" stroke="#0075BE"/>
      <rect x="490" y="160" width="120" height="3" rx="1" fill="#e2e8f0"/>

      <!-- conditional block -->
      <rect x="490" y="172" width="144" height="46" rx="2" fill="#f8fafc" stroke="#0075BE" stroke-dasharray="3 2"/>
      <text x="498" y="186" font-family="system-ui,sans-serif" font-size="7" font-weight="800" fill="#0075BE">IF maturity date</text>
      <text x="498" y="198" font-family="system-ui,sans-serif" font-size="7" font-weight="600" fill="#64748b">THEN show schedule</text>
      <rect x="498" y="204" width="88" height="8" rx="1" fill="#dbeafe"/>
    </g>

    <!-- Side: field mapping panel -->
    <g filter="url(#bdShadowSm)">
      <rect x="656" y="42" width="96" height="120" rx="4" fill="#fff" stroke="#93c5fd"/>
      <text x="668" y="58" font-family="system-ui,sans-serif" font-size="7" font-weight="700" fill="#0075BE" letter-spacing="0.06em">DATA MAP</text>

      <rect x="668" y="68" width="10" height="10" rx="1" fill="#0075BE"/>
      <text x="684" y="76" font-family="system-ui,sans-serif" font-size="7" font-weight="600" fill="#334155">acct_num</text>
      <path d="M668 84 H740" stroke="#bfdbfe" stroke-width="1"/>

      <rect x="668" y="92" width="10" height="10" rx="1" fill="#0075BE"/>
      <text x="684" y="100" font-family="system-ui,sans-serif" font-size="7" font-weight="600" fill="#334155">int_rate</text>
      <path d="M668 108 H740" stroke="#bfdbfe" stroke-width="1"/>

      <rect x="668" y="116" width="10" height="10" rx="1" fill="#94a3b8"/>
      <text x="684" y="124" font-family="system-ui,sans-serif" font-size="7" font-weight="600" fill="#64748b">legal_static</text>
      <path d="M668 132 H740" stroke="#bfdbfe" stroke-width="1"/>

      <rect x="668" y="140" width="10" height="10" rx="1" fill="#38bdf8"/>
      <text x="684" y="148" font-family="system-ui,sans-serif" font-size="7" font-weight="600" fill="#334155">maturity?</text>
    </g>

    <!-- Content type legend -->
    <g>
      <rect x="656" y="172" width="96" height="58" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <circle cx="668" cy="188" r="4" fill="#0075BE"/>
      <text x="678" y="191" font-family="system-ui,sans-serif" font-size="7" font-weight="600" fill="#334155">System data</text>
      <circle cx="668" cy="202" r="4" fill="#94a3b8"/>
      <text x="678" y="205" font-family="system-ui,sans-serif" font-size="7" font-weight="600" fill="#334155">Legal static</text>
      <circle cx="668" cy="216" r="4" fill="#38bdf8"/>
      <text x="678" y="219" font-family="system-ui,sans-serif" font-size="7" font-weight="600" fill="#334155">Conditional</text>
    </g>

    <text x="614" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#0075BE" letter-spacing="0.12em">AFTER</text>
  </g>
</svg>
