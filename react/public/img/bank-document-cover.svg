<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-label="Before and after: static print forms versus system-ready document templates">
  <defs>
    <linearGradient id="bdg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0075BE"/>
      <stop offset="100%" stop-color="#005a94"/>
    </linearGradient>
    <filter id="bdShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0075BE" flood-opacity="0.12"/>
    </filter>
    <filter id="bdShadowSm" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0075BE" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="800" height="280" fill="#f1f5f9"/>

  <!-- LEFT: stacked print sheets — free floating, not one dense page -->
  <g>
    <rect x="36" y="28" width="300" height="224" rx="6" fill="#e2e8f0"/>

    <rect x="78" y="58" width="170" height="120" rx="4" fill="#fff" stroke="#cbd5e1" transform="rotate(-8 163 118)" filter="url(#bdShadowSm)"/>
    <rect x="90" y="72" width="110" height="6" fill="#94a3b8" transform="rotate(-8 145 75)"/>
    <rect x="92" y="88" width="130" height="3" fill="#e2e8f0" transform="rotate(-8 157 89)"/>
    <rect x="94" y="98" width="120" height="3" fill="#e2e8f0" transform="rotate(-8 154 99)"/>
    <rect x="96" y="108" width="100" height="3" fill="#e2e8f0" transform="rotate(-8 146 109)"/>

    <rect x="130" y="78" width="170" height="120" rx="4" fill="#fff" stroke="#cbd5e1" transform="rotate(6 215 138)" filter="url(#bdShadow)"/>
    <rect x="148" y="96" width="100" height="6" fill="#a1a1aa" transform="rotate(6 198 99)"/>
    <rect x="150" y="112" width="130" height="3" fill="#d4d4d8" transform="rotate(6 215 113)"/>
    <rect x="152" y="122" width="118" height="3" fill="#d4d4d8" transform="rotate(6 211 123)"/>
    <rect x="154" y="132" width="126" height="3" fill="#d4d4d8" transform="rotate(6 217 133)"/>
    <rect x="156" y="142" width="90" height="3" fill="#d4d4d8" transform="rotate(6 201 143)"/>
    <rect x="158" y="158" width="70" height="18" fill="#f1f5f9" stroke="#e2e8f0" transform="rotate(6 193 167)"/>

    <text x="186" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#64748b">Static print forms</text>
    <text x="186" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.12em">BEFORE</text>
  </g>

  <!-- VS -->
  <g>
    <circle cx="400" cy="130" r="26" fill="#fff" stroke="#0075BE" stroke-width="2" filter="url(#bdShadowSm)"/>
    <text x="400" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#0075BE" letter-spacing="0.06em">VS</text>
  </g>

  <!-- RIGHT: modular template system collage -->
  <g>
    <rect x="464" y="28" width="300" height="224" rx="6" fill="#dbeafe"/>

    <rect x="502" y="48" width="218" height="150" rx="20" fill="#bfdbfe" filter="url(#bdShadow)"/>
    <rect x="486" y="64" width="222" height="138" rx="20" fill="#fff" filter="url(#bdShadow)"/>

    <text x="508" y="100" font-family="system-ui,sans-serif" font-size="15" font-weight="800" fill="#0f172a">Fields that</text>
    <text x="508" y="120" font-family="system-ui,sans-serif" font-size="15" font-weight="800" fill="#0f172a">know the system.</text>

    <rect x="508" y="136" width="118" height="22" rx="11" fill="#eff6ff" stroke="#93c5fd" filter="url(#bdShadowSm)"/>
    <rect x="520" y="143" width="28" height="8" rx="2" fill="#0075BE"/>
    <text x="556" y="150" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#005a94">Mapped data</text>

    <circle cx="686" cy="168" r="16" fill="url(#bdg)" filter="url(#bdShadowSm)"/>
    <text x="686" y="172" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="800" fill="#fff">DOC</text>

    <rect x="508" y="172" width="58" height="16" rx="4" fill="#dbeafe"/>
    <text x="537" y="183" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#0075BE">If / Then</text>
    <rect x="574" y="172" width="72" height="16" rx="4" fill="#dbeafe"/>
    <text x="610" y="183" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#0075BE">Reusable</text>

    <text x="614" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#0075BE" letter-spacing="0.12em">AFTER</text>
  </g>
</svg>
