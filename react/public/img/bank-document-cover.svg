<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-label="Before and after: plain legacy document versus designed bank document system">
  <defs>
    <linearGradient id="bdg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0075BE"/>
      <stop offset="100%" stop-color="#005a94"/>
    </linearGradient>
  </defs>

  <rect width="800" height="280" fill="#f4f4f5"/>

  <!-- LEFT: plain / undesigned document -->
  <g>
    <rect x="36" y="28" width="300" height="224" fill="#fff" stroke="#d4d4d8" stroke-width="1.5"/>
    <!-- dense unstyled text block — no hierarchy -->
    <rect x="56" y="48" width="180" height="7" fill="#a1a1aa"/>
    <rect x="56" y="68" width="260" height="4" fill="#d4d4d8"/>
    <rect x="56" y="78" width="248" height="4" fill="#d4d4d8"/>
    <rect x="56" y="88" width="254" height="4" fill="#d4d4d8"/>
    <rect x="56" y="98" width="236" height="4" fill="#d4d4d8"/>
    <rect x="56" y="108" width="260" height="4" fill="#d4d4d8"/>
    <rect x="56" y="118" width="220" height="4" fill="#d4d4d8"/>
    <rect x="56" y="138" width="160" height="5" fill="#a1a1aa"/>
    <rect x="56" y="154" width="260" height="4" fill="#d4d4d8"/>
    <rect x="56" y="164" width="244" height="4" fill="#d4d4d8"/>
    <rect x="56" y="174" width="252" height="4" fill="#d4d4d8"/>
    <rect x="56" y="184" width="230" height="4" fill="#d4d4d8"/>
    <rect x="56" y="194" width="260" height="4" fill="#d4d4d8"/>
    <rect x="56" y="214" width="200" height="4" fill="#d4d4d8"/>
    <rect x="56" y="224" width="140" height="4" fill="#d4d4d8"/>
    <text x="186" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#71717a" letter-spacing="0.12em">BEFORE</text>
  </g>

  <!-- VS badge -->
  <g>
    <circle cx="400" cy="130" r="26" fill="#fff" stroke="#0075BE" stroke-width="2"/>
    <text x="400" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#0075BE" letter-spacing="0.06em">VS</text>
  </g>

  <!-- RIGHT: designed system document -->
  <g>
    <rect x="464" y="28" width="300" height="224" fill="#fff" stroke="#c8dff0" stroke-width="1.5"/>
    <rect x="464" y="28" width="300" height="36" fill="url(#bdg)"/>
    <rect x="476" y="36" width="56" height="20" rx="2" fill="#fff"/>
    <text x="504" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="800" fill="#0075BE">DOC</text>
    <rect x="544" y="42" width="140" height="8" rx="1" fill="#fff" opacity="0.35"/>
    <rect x="464" y="64" width="300" height="6" fill="#c8dff0"/>

    <rect x="480" y="84" width="128" height="36" fill="#fafafa" stroke="#e3e3e3"/>
    <rect x="488" y="94" width="72" height="5" fill="#94a3b8"/>
    <rect x="488" y="104" width="96" height="6" fill="#0075BE" opacity="0.55"/>

    <rect x="620" y="84" width="128" height="36" fill="#fafafa" stroke="#e3e3e3"/>
    <rect x="628" y="94" width="64" height="5" fill="#94a3b8"/>
    <rect x="628" y="104" width="88" height="6" fill="#0075BE" opacity="0.55"/>

    <rect x="480" y="134" width="268" height="6" fill="#0075BE" opacity="0.2" rx="1"/>
    <rect x="480" y="148" width="240" height="4" fill="#cbd5e1" rx="1"/>
    <rect x="480" y="158" width="220" height="4" fill="#cbd5e1" rx="1"/>
    <rect x="480" y="168" width="248" height="4" fill="#cbd5e1" rx="1"/>

    <rect x="480" y="186" width="268" height="28" fill="#f0f6fb" stroke="#c8dff0"/>
    <rect x="488" y="196" width="100" height="8" fill="#0075BE" opacity="0.45"/>

    <rect x="480" y="226" width="120" height="5" fill="#0075BE" rx="1"/>
    <rect x="480" y="236" width="90" height="5" fill="#0075BE" rx="1"/>

    <text x="614" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#0075BE" letter-spacing="0.12em">AFTER</text>
  </g>
</svg>
