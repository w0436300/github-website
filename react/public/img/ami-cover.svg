<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-label="Ami adaptive learning companion — learning style onboarding">
  <defs>
    <linearGradient id="ami-cta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5e9ea5"/>
      <stop offset="100%" stop-color="#78b2b9"/>
    </linearGradient>
    <filter id="amiSoft" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#347680" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Pure white canvas -->
  <rect width="800" height="280" fill="#ffffff"/>

  <!-- Brand lockup — inset, safe from crop -->
  <g transform="translate(56 44)">
    <path d="M16 2 L30 26 L2 26 Z" fill="#1e293b"/>
    <path d="M5 20 Q16 10 27 20" fill="none" stroke="#78b2b9" stroke-width="3.5" stroke-linecap="round"/>
    <text x="42" y="22" font-family="system-ui,sans-serif" font-size="28" font-weight="800" fill="#0f172a">Ami</text>
  </g>
  <text x="56" y="92" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#64748b">Adaptive Learning Companion</text>

  <!-- Stepper -->
  <g transform="translate(56 118)">
    <circle cx="9" cy="9" r="9" fill="#78b2b9"/>
    <path d="M4.5 9 L7.5 12 L14 5.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="22" y1="9" x2="52" y2="9" stroke="#c3f0ed" stroke-width="2"/>
    <circle cx="65" cy="9" r="9" fill="#fff" stroke="#78b2b9" stroke-width="2"/>
    <text x="65" y="13" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#347680">2</text>
    <line x1="78" y1="9" x2="108" y2="9" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="121" cy="9" r="9" fill="#e2e8f0"/>
    <text x="121" y="13" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#94a3b8">3</text>
  </g>

  <!-- CTAs -->
  <g transform="translate(56 168)">
    <rect x="0" y="0" width="64" height="28" rx="14" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="32" y="18" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#334155">Back</text>
    <rect x="76" y="0" width="100" height="28" rx="14" fill="url(#ami-cta)"/>
    <text x="126" y="18" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff">Continue</text>
  </g>

  <!-- Learning-style panel — upright, fully inside frame -->
  <g transform="translate(320 32)" filter="url(#amiSoft)">
    <rect x="0" y="0" width="424" height="216" rx="16" fill="#fff" stroke="#e2e8f0"/>
    <text x="24" y="32" font-family="system-ui,sans-serif" font-size="15" font-weight="800" fill="#0f172a">How do you learn best?</text>

    <rect x="20" y="48" width="384" height="26" rx="7" fill="#fff" stroke="#e8eef0"/>
    <circle cx="38" cy="61" r="5.5" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="54" y="65" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#334155">Interactive</text>
    <text x="140" y="65" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Try things · get feedback</text>

    <rect x="20" y="82" width="384" height="26" rx="7" fill="#fff" stroke="#e8eef0"/>
    <circle cx="38" cy="95" r="5.5" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="54" y="99" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#334155">Textual</text>
    <text x="122" y="99" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Read · reflect first</text>

    <rect x="20" y="116" width="384" height="38" rx="7" fill="#e8f9f7" stroke="#78b2b9" stroke-width="1.5"/>
    <circle cx="38" cy="135" r="6.5" fill="#78b2b9"/>
    <circle cx="38" cy="135" r="2.2" fill="#fff"/>
    <text x="56" y="131" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#1c532f">Visual</text>
    <text x="56" y="146" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#5e9ea5">Diagrams, examples, visual breakdowns</text>

    <rect x="20" y="162" width="384" height="26" rx="7" fill="#fff" stroke="#e8eef0"/>
    <circle cx="38" cy="175" r="5.5" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="54" y="179" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#334155">Concise</text>
    <text x="126" y="179" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Key concepts first</text>
  </g>
</svg>
