<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-label="Ami adaptive learning companion — learning style onboarding">
  <defs>
    <linearGradient id="ami-cta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5e9ea5"/>
      <stop offset="100%" stop-color="#78b2b9"/>
    </linearGradient>
    <linearGradient id="ami-wash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f9f7"/>
      <stop offset="55%" stop-color="#f2fffb"/>
      <stop offset="100%" stop-color="#dff5f3"/>
    </linearGradient>
    <filter id="amiSoft" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#347680" flood-opacity="0.12"/>
    </filter>
    <filter id="amiSoftSm" x="-25%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#347680" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Full-bleed mint field — no split / no VS -->
  <rect width="800" height="280" fill="url(#ami-wash)"/>

  <!-- Soft organic blobs (Ami atmosphere, not a before panel) -->
  <path
    d="M-40 40 C 80 -30, 220 10, 280 90 C 200 140, 40 160, -30 110 Z"
    fill="#c3f0ed"
    opacity="0.55"
  />
  <path
    d="M620 -20 C 760 -40, 860 40, 840 140 C 780 180, 640 120, 600 40 Z"
    fill="#b8e8e4"
    opacity="0.45"
  />
  <path
    d="M360 220 C 480 180, 620 240, 700 300 C 520 310, 300 290, 360 220 Z"
    fill="#c3f0ed"
    opacity="0.4"
  />

  <!-- Brand lockup — left -->
  <g transform="translate(48 52)">
    <path d="M22 2 L42 36 L2 36 Z" fill="#1e293b"/>
    <path d="M6 28 Q22 12 38 28" fill="none" stroke="#78b2b9" stroke-width="4.5" stroke-linecap="round"/>
    <text x="56" y="30" font-family="system-ui,sans-serif" font-size="36" font-weight="800" fill="#0f172a">Ami</text>
  </g>
  <text x="48" y="110" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#64748b">Your Adaptive Learning Companion</text>

  <!-- Progress stepper -->
  <g transform="translate(48 134)">
    <circle cx="10" cy="10" r="10" fill="#78b2b9"/>
    <path d="M5 10 L8.5 13.5 L15.5 6.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="24" y1="10" x2="58" y2="10" stroke="#c3f0ed" stroke-width="2"/>
    <circle cx="72" cy="10" r="10" fill="#fff" stroke="#78b2b9" stroke-width="2.2"/>
    <text x="72" y="14" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#347680">2</text>
    <line x1="86" y1="10" x2="120" y2="10" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="134" cy="10" r="10" fill="#e2e8f0"/>
    <text x="134" y="14" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#94a3b8">3</text>
    <text x="10" y="34" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="600" fill="#78b2b9">Goal</text>
    <text x="72" y="34" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#347680">Style</text>
    <text x="134" y="34" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="600" fill="#94a3b8">Resume</text>
  </g>

  <!-- Floating Continue + Back (product CTAs, not a circular icon) -->
  <g transform="translate(48 200)" filter="url(#amiSoftSm)">
    <rect x="0" y="0" width="72" height="32" rx="16" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="36" y="21" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#334155">Back</text>
    <rect x="84" y="0" width="108" height="32" rx="16" fill="url(#ami-cta)"/>
    <text x="138" y="21" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#fff">Continue</text>
  </g>

  <!-- Learning-style list panel — tilted product fragment, unique to Ami -->
  <g transform="translate(360 28) rotate(-2 200 110)" filter="url(#amiSoft)">
    <rect x="0" y="0" width="400" height="220" rx="18" fill="#fff"/>
    <text x="28" y="36" font-family="system-ui,sans-serif" font-size="16" font-weight="800" fill="#0f172a">How do you learn best?</text>

    <!-- Interactive -->
    <rect x="24" y="52" width="352" height="28" rx="8" fill="#fff" stroke="#e8eef0"/>
    <circle cx="44" cy="66" r="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="60" y="70" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#334155">Interactive</text>
    <text x="148" y="70" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Try things · get feedback</text>

    <!-- Textual -->
    <rect x="24" y="88" width="352" height="28" rx="8" fill="#fff" stroke="#e8eef0"/>
    <circle cx="44" cy="102" r="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="60" y="106" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#334155">Textual</text>
    <text x="128" y="106" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Read · reflect first</text>

    <!-- Visual — selected -->
    <rect x="24" y="124" width="352" height="40" rx="8" fill="#e8f9f7" stroke="#78b2b9" stroke-width="1.5"/>
    <circle cx="44" cy="144" r="7" fill="#78b2b9"/>
    <circle cx="44" cy="144" r="2.5" fill="#fff"/>
    <text x="62" y="140" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#1c532f">Visual</text>
    <text x="62" y="156" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#5e9ea5">Diagrams, examples, visual breakdowns</text>

    <!-- Concise -->
    <rect x="24" y="172" width="352" height="28" rx="8" fill="#fff" stroke="#e8eef0"/>
    <circle cx="44" cy="186" r="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="60" y="190" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#334155">Concise</text>
    <text x="132" y="190" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Key concepts first</text>
  </g>

  <!-- Tiny floating skill-gap chip (product cue, not a hero-card pill row) -->
  <g transform="translate(300 210) rotate(4)" filter="url(#amiSoftSm)">
    <rect width="120" height="36" rx="10" fill="#fff" stroke="#c3f0ed"/>
    <circle cx="18" cy="18" r="7" fill="#dff5f3"/>
    <path d="M15 18h6M18 15v6" stroke="#78b2b9" stroke-width="1.6" stroke-linecap="round"/>
    <text x="32" y="16" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#347680">Skill gap</text>
    <text x="32" y="28" font-family="system-ui,sans-serif" font-size="8" font-weight="500" fill="#64748b">Reviewable AI</text>
  </g>
</svg>
