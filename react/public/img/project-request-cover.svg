<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-label="Before and after: Excel Word Email versus a single project request input">
  <defs>
    <linearGradient id="pr-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>

  <rect width="800" height="280" fill="#f7fef9"/>

  <!-- LEFT: Excel + Word + Email icons (fragmented intake) -->
  <g>
    <rect x="36" y="28" width="300" height="224" fill="#fff" stroke="#bbf7d0" stroke-width="1.5"/>

    <!-- Excel -->
    <g transform="translate(68 72)">
      <rect width="56" height="56" rx="6" fill="#107c41"/>
      <text x="28" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="800" fill="#fff">X</text>
      <text x="28" y="74" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.06em">EXCEL</text>
    </g>

    <!-- Word -->
    <g transform="translate(158 72)">
      <rect width="56" height="56" rx="6" fill="#2b579a"/>
      <text x="28" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="800" fill="#fff">W</text>
      <text x="28" y="74" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.06em">WORD</text>
    </g>

    <!-- Email -->
    <g transform="translate(248 72)">
      <rect width="56" height="56" rx="6" fill="#64748b"/>
      <rect x="12" y="16" width="32" height="24" rx="2" fill="none" stroke="#fff" stroke-width="2.5"/>
      <path d="M12 18 L28 30 L44 18" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="74" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.06em">EMAIL</text>
    </g>

    <!-- chaotic arrows / scatter hint -->
    <path d="M96 170 L96 190 L186 190 L186 170" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M186 170 L186 190 L276 190 L276 170" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="186" y="218" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#64748b">Scattered requests</text>

    <text x="186" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.12em">BEFORE</text>
  </g>

  <!-- VS badge -->
  <g>
    <circle cx="400" cy="130" r="26" fill="#fff" stroke="#15803d" stroke-width="2"/>
    <text x="400" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#15803d" letter-spacing="0.06em">VS</text>
  </g>

  <!-- RIGHT: single unified request input (not a full page) -->
  <g>
    <rect x="464" y="28" width="300" height="224" fill="#fff" stroke="#86efac" stroke-width="1.5"/>

    <text x="614" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#166534" letter-spacing="0.04em">ONE REQUEST ENTRY</text>

    <!-- single input field -->
    <rect x="500" y="100" width="228" height="52" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <rect x="514" y="118" width="140" height="8" rx="1" fill="#86efac"/>
    <rect x="514" y="132" width="100" height="6" rx="1" fill="#bbf7d0"/>
    <circle cx="700" cy="126" r="12" fill="url(#pr-g)"/>
    <path d="M695 126h10M700 121v10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>

    <!-- tiny status chips under input -->
    <rect x="500" y="172" width="64" height="18" rx="2" fill="#dcfce7" stroke="#86efac"/>
    <text x="532" y="184" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#166534">INTAKE</text>
    <rect x="574" y="172" width="72" height="18" rx="2" fill="#dcfce7" stroke="#86efac"/>
    <text x="610" y="184" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#166534">TRACK</text>
    <rect x="656" y="172" width="72" height="18" rx="2" fill="#dcfce7" stroke="#86efac"/>
    <text x="692" y="184" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#166534">COLLAB</text>

    <text x="614" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#64748b">Unified intake</text>

    <text x="614" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#15803d" letter-spacing="0.12em">AFTER</text>
  </g>
</svg>
