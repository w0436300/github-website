<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-label="Before and after: email and OneDrive versus AI chat knowledge feature">
  <defs>
    <linearGradient id="kb-g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="280" fill="#fafaf9"/>

  <!-- LEFT: Email + OneDrive icons (fragmented knowledge) -->
  <g>
    <rect x="36" y="28" width="300" height="224" fill="#fff" stroke="#d6d3d1" stroke-width="1.5"/>

    <!-- Email icon -->
    <g transform="translate(78 78)">
      <rect width="72" height="72" rx="8" fill="#64748b"/>
      <rect x="14" y="22" width="44" height="30" rx="3" fill="none" stroke="#fff" stroke-width="3"/>
      <path d="M14 25 L36 40 L58 25" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#78716c" letter-spacing="0.06em">EMAIL</text>
    </g>

    <!-- OneDrive / cloud folder icon -->
    <g transform="translate(222 78)">
      <rect width="72" height="72" rx="8" fill="#ea580c"/>
      <path d="M22 44c0-10 8-18 18-18 3 0 6 1 8 2 3-7 10-12 18-12 11 0 20 9 20 20 0 1 0 2-1 3h-3c-8 0-15 5-18 12H40c-10 0-18-8-18-19z" fill="#fff" opacity="0.95"/>
      <rect x="24" y="40" width="36" height="18" rx="2" fill="#ffedd5"/>
      <text x="36" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#78716c" letter-spacing="0.02em">ONEDRIVE</text>
    </g>

    <path d="M114 188 L114 200 L258 200 L258 188" fill="none" stroke="#d6d3d1" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="186" y="224" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#78716c">Scattered sources</text>

    <text x="186" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#78716c" letter-spacing="0.12em">BEFORE</text>
  </g>

  <!-- VS badge -->
  <g>
    <circle cx="400" cy="130" r="26" fill="#fff" stroke="#ea580c" stroke-width="2"/>
    <text x="400" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#c2410c" letter-spacing="0.06em">VS</text>
  </g>

  <!-- RIGHT: AI chat feature highlight only (not a full page) -->
  <g>
    <rect x="464" y="28" width="300" height="224" fill="#fff" stroke="#fdba74" stroke-width="1.5"/>

    <text x="614" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#c2410c" letter-spacing="0.04em">ASK ONCE · GET ANSWERS</text>

    <!-- chat bubble feature focal -->
    <rect x="500" y="100" width="228" height="64" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <circle cx="524" cy="124" r="12" fill="url(#kb-g)"/>
    <path d="M519 124h10M524 119v10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <rect x="546" y="114" width="150" height="8" rx="1" fill="#c2410c" opacity="0.55"/>
    <rect x="546" y="130" width="120" height="6" rx="1" fill="#fdba74"/>
    <rect x="546" y="144" width="90" height="6" rx="1" fill="#fed7aa"/>

    <!-- citation chips — the key knowledge feature -->
    <rect x="500" y="182" width="64" height="18" rx="2" fill="#ffedd5" stroke="#fb923c"/>
    <text x="532" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#9a3412">SOURCE</text>
    <rect x="574" y="182" width="64" height="18" rx="2" fill="#ffedd5" stroke="#fb923c"/>
    <text x="606" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#9a3412">TRUST</text>
    <rect x="648" y="182" width="80" height="18" rx="2" fill="#ffedd5" stroke="#fb923c"/>
    <text x="688" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#9a3412">CITATIONS</text>

    <text x="614" y="224" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#78716c">AI chat feature</text>

    <text x="614" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#c2410c" letter-spacing="0.12em">AFTER</text>
  </g>
</svg>
